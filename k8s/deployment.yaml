apiVersion: apps/v1
kind: Deployment
metadata:
  name: chai-com
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chai-com
  template:
    metadata:
      labels:
        app: chai-com
    spec:
      containers:
        - name: chai-com
          image: 474221741098.dkr.ecr.ap-southeast-2.amazonaws.com/chai-com:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_OPTIONS
              value: "--max_old_space_size=4096"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4.5Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /rest/admin/application-version
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: chai-com-config
              mountPath: /chai-com/config/default.yml
              subPath: default.yml
      volumes:
        - name: chai-com-config
          configMap:
            name: chai-com-config
