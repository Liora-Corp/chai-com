name: "Security Audit"

on:
  pull_request:
  push:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── SAST ─────────────────────────────────────────────────────────────────────
  sast:
    name: "SAST – Semgrep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: "Run Semgrep (TypeScript / Node.js / OWASP Top 10)"
        continue-on-error: true
        run: |
          set +e
          pip install semgrep --quiet
          semgrep scan \
            --config "p/typescript" \
            --config "p/nodejs" \
            --config "p/owasp-top-ten" \
            --config "p/express" \
            --json \
            --output semgrep-results.json \
            --no-error-on-findings \
            .
          exit 0

      - name: "Convert Semgrep JSON → HTML report"
        run: |
          [ -f semgrep-results.json ] || \
            echo '{"results":[],"errors":[{"message":"Semgrep did not run or produced no output"}]}' \
            > semgrep-results.json
          python3 .github/scripts/sast_report.py

      - name: "Upload SAST report"
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: sast-report
          path: sast-report.html

      - name: "Output SAST summary"
        run: |
          COUNT=$(python3 -c "import json,os; d=json.load(open('semgrep-results.json')) if os.path.exists('semgrep-results.json') else {'results':[]}; print(len(d.get('results',[])))")
          echo "### SAST (Semgrep)" >> $GITHUB_STEP_SUMMARY
          echo "- **Findings:** $COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Download \`sast-report.html\` from the Artifacts section below." >> $GITHUB_STEP_SUMMARY

  # ── SCA ──────────────────────────────────────────────────────────────────────
  sca:
    name: "SCA – npm audit + Trivy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: 22

      - name: "npm audit (JSON)"
        run: npm audit --json > npm-audit.json || true

      - name: "Run Trivy SCA (filesystem / npm deps)"
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 #0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: template
          template: "@/contrib/html.tpl"
          output: trivy-sca-report.html
          severity: CRITICAL,HIGH,MEDIUM,LOW
        continue-on-error: true

      - name: "Build combined SCA report"
        run: python3 .github/scripts/sca_report.py

      - name: "Upload SCA reports"
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: sca-report
          path: |
            sca-report.html
            trivy-sca-report.html
            npm-audit.json

      - name: "Output SCA summary"
        run: python3 .github/scripts/sca_summary.py >> $GITHUB_STEP_SUMMARY

  # ── IaC ──────────────────────────────────────────────────────────────────────
  iac:
    name: "IaC – Trivy (k8s + Dockerfile)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: "Run Trivy IaC scan (Kubernetes manifests + Dockerfile)"
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 #0.24.0
        with:
          scan-type: config
          scan-ref: .
          format: template
          template: "@/contrib/html.tpl"
          output: iac-report.html
          severity: CRITICAL,HIGH,MEDIUM,LOW
        continue-on-error: true

      - name: "Run Trivy IaC scan (JSON for summary)"
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 #0.24.0
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: iac-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
        continue-on-error: true

      - name: "Upload IaC report"
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: iac-report
          path: |
            iac-report.html
            iac-results.json

      - name: "Output IaC summary"
        run: python3 .github/scripts/iac_summary.py >> $GITHUB_STEP_SUMMARY

  # ── PR comment with links to artifacts ───────────────────────────────────────
  pr-comment:
    name: "Post PR summary"
    needs: [sast, sca, iac]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: "Comment on PR"
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea #v7.0.1
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Security Audit Results',
              '',
              '| Scan | Tool | Report |',
              '|------|------|--------|',
              `| SAST | Semgrep (TypeScript / Node.js / OWASP Top 10) | [Download sast-report.html](${runUrl}) |`,
              `| SCA  | npm audit + Trivy (dependency vulnerabilities) | [Download sca-report.html](${runUrl}) |`,
              `| IaC  | Trivy (Kubernetes manifests + Dockerfile)       | [Download iac-report.html](${runUrl}) |`,
              '',
              `> Artifacts are available in the [Actions run](${runUrl}) for 90 days.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Security Audit Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
