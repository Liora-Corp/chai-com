name: 'Security Gate Review'

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scan_payload:
        description: 'Trust360 scan result JSON payload'
        required: false
        type: string
  repository_dispatch:
    types: [trust360-scan-complete]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  # ── Job 1: scan ─────────────────────────────────────────────────────────────
  # Always completes. Generates + uploads artifacts, posts PR comment.
  # Gate decision passed to job 2 via outputs.
  scan:
    name: 'Security Gate Review — Scan'
    runs-on: ubuntu-latest
    outputs:
      gate: ${{ steps.report.outputs.gate }}
      gate_reason: ${{ steps.report.outputs.gate_reason }}
      scan_id: ${{ steps.report.outputs.scan_id }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      # ── 1. Simulate scanning phase ─────────────────────────────────────────
      - name: 'Scanning PR diff...'
        run: |
          echo "::notice::Security Gate Review initialising..."
          echo ""
          echo "  Connecting to Trust360 engine..."
          sleep 4
          echo "  Fetching PR diff..."
          sleep 4
          echo "  Analysing changed files:"
          echo "    routes/search.ts                 [DONE]"
          sleep 2
          echo "    routes/profileImageUrl.ts        [DONE]"
          sleep 2
          echo "    .env.example                     [DONE]"
          sleep 1
          echo "    helm/charts/chai-com/deployment.yaml  [DONE]"
          sleep 2
          echo "  Running SAST + Secrets scan...     [DONE]"
          sleep 3
          echo ""
          echo "  ── IaC scan ─────────────────────────────────────────────────"
          echo "    terraform/eks-nodes.tf           [DONE]"
          sleep 1
          echo "    terraform/iam.tf                 [DONE]"
          sleep 1
          echo ""
          echo "  ── Deploying to QA environment for security validation... ───"
          sleep 3
          echo "  QA deployment in progress..."
          sleep 8
          echo "  QA deployment complete. Running active security validation..."
          sleep 2
          echo ""
          echo "  Running security rule engine...    [DONE]"
          sleep 3
          echo "  Evaluating gate policy...          [DONE]"
          sleep 2
          echo ""
          echo "  Scan complete. Loading results... "

      # ── 2. Load scan data ──────────────────────────────────────────────────
      - name: 'Load scan data'
        run: |
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "repository_dispatch" ]; then
            echo '${{ toJson(github.event.client_payload) }}' > scan.json

          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n '${{ inputs.scan_payload }}' ]; then
            echo '${{ inputs.scan_payload }}' > scan.json

          else
            # Demo data — Trust360 scan result for PR #8 (feat/search)
            cat > scan.json <<'ENDJSON'
          {
            "scanId": "scan-b7d4e1a3-pr8",
            "prNumber": "#8",
            "prTitle": "feat(search): add user search and profile image URL endpoints",
            "serviceName": "chai-com",
            "prAuthor": "ashok-yannam",
            "prBranch": "feat/search",
            "prBaseBranch": "main",
            "repo": "Liora-Corp/chai-com",
            "gate": "BLOCKED",
            "gateReason": "BLOCKED — critical kill-chain confirmed: SSRF → IMDSv1 → s3:* wildcard IAM achieves full cloud account takeover. 11 critical findings require remediation before merge.",
            "completedAt": "2026-04-15T11:23:00Z",
            "ciStatus": "failing",
            "findingCounts": { "critical": 11, "high": 7, "medium": 3, "low": 6, "info": 21 },
            "immediateActions": [
              {
                "priority": 1,
                "title": "Block SSRF → IMDS Escalation",
                "owner": "[DevOps] + [AppSec]",
                "impact": "Enforce IMDSv2 (http_tokens = \"required\") in terraform/eks-nodes.tf and add URL allowlist in routes/profileImageUrl.ts — any app-layer vulnerability currently allows IAM credential extraction from the node metadata service."
              },
              {
                "priority": 2,
                "title": "Lock Down Node IAM Role (s3:*)",
                "owner": "[CloudSec]",
                "impact": "Replace s3:* wildcard with scoped policy in terraform/iam.tf — a compromised pod instantly has read/write to all S3 buckets exposing 2.1M PII records."
              },
              {
                "priority": 3,
                "title": "Remove Kubelet Anonymous Auth",
                "owner": "[SecOps / Platform]",
                "impact": "Set anonymous-auth: false in kubelet config — anyone inside the VPC can exec into any pod, bypassing Kubernetes RBAC entirely."
              }
            ],
            "diffMeta": {
              "filesChanged": [
                "routes/search.ts",
                "routes/profileImageUrl.ts",
                ".env.example",
                "helm/charts/chai-com/deployment.yaml",
                "terraform/eks-nodes.tf",
                "terraform/iam.tf"
              ],
              "insertions": 220,
              "deletions": 15,
              "prLink": "https://github.com/Liora-Corp/chai-com/pull/8",
              "prBaseBranch": "main",
              "rawDiff": "diff --git a/routes/search.ts b/routes/search.ts\nindex 1a2b3c4..9d8e7f6 100644\n--- a/routes/search.ts\n+++ b/routes/search.ts\n@@ -12,6 +12,14 @@ import { db } from '../db';\n router.get('/rest/user/search', async (req, res) => {\n-  res.json([]);\n+  const { q } = req.query;\n+  // ⚠ SAST-001 — SQL injection: user-supplied 'q' concatenated into raw query\n+  const query = `SELECT * FROM users WHERE username LIKE '%${q}%' OR email LIKE '%${q}%'`;\n+  const result = await db.raw(query);\n+  res.json(result.rows);\n });\n\ndiff --git a/routes/profileImageUrl.ts b/routes/profileImageUrl.ts\nindex 3c4d5e6..7f8g9h0 100644\n--- a/routes/profileImageUrl.ts\n+++ b/routes/profileImageUrl.ts\n@@ -1,4 +1,16 @@\n+import fetch from 'node-fetch';\n+\n+// ⚠ SAST-002 — SSRF: unvalidated URL parameter allows internal network probing\n+router.get('/profileImageUrl', async (req, res) => {\n+  const { url } = req.query as { url: string };\n+  const response = await fetch(url);\n+  const buffer = await response.buffer();\n+  res.set('Content-Type', response.headers.get('content-type') ?? 'application/octet-stream');\n+  res.send(buffer);\n+});\n\ndiff --git a/.env.example b/.env.example\nindex 2a3b4c5..8d9e0f1 100644\n--- a/.env.example\n+++ b/.env.example\n@@ -4,3 +4,7 @@ JWT_SECRET=change-me\n+# ⚠ SECRETS-001 — Active AWS credentials committed to source\n+AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE\n+AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n+AWS_DEFAULT_REGION=us-east-1\n\ndiff --git a/helm/charts/chai-com/deployment.yaml b/helm/charts/chai-com/deployment.yaml\nindex 4e5f6g7..8h9i0j1 100644\n--- a/helm/charts/chai-com/deployment.yaml\n+++ b/helm/charts/chai-com/deployment.yaml\n@@ -18,6 +18,10 @@ spec:\n       containers:\n         - name: chai-com-app\n           image: gcr.io/liora-corp/chai-com:latest\n+          # ⚠ HELM-001 — privileged container with hostPID\n+          securityContext:\n+            privileged: true\n+            hostPID: true\n\ndiff --git a/terraform/eks-nodes.tf b/terraform/eks-nodes.tf\nindex 5b6c7d8..9e0f1g2 100644\n--- a/terraform/eks-nodes.tf\n+++ b/terraform/eks-nodes.tf\n@@ -12,4 +12,6 @@ resource \"aws_launch_template\" \"chai_com_nodes\" {\n+  # ⚠ TF-001 — IMDSv1 enabled: any pod can query 169.254.169.254 without a session token\n+  metadata_options {\n+    http_tokens                 = \"optional\"\n+    http_put_response_hop_limit = 2\n+  }\n }\n\ndiff --git a/terraform/iam.tf b/terraform/iam.tf\nindex 0a1b2c3..4d5e6f7 100644\n--- a/terraform/iam.tf\n+++ b/terraform/iam.tf\n@@ -8,5 +8,7 @@ resource \"aws_iam_role_policy\" \"chai_com_node_role_policy\" {\n+  # ⚠ TF-002 — overly permissive IAM: s3:* wildcard on node role\n+  policy = jsonencode({\n+    Statement = [{ Effect = \"Allow\", Action = \"s3:*\", Resource = \"*\" }]\n+  })\n }"
            },
            "findings": [
              {
                "id": "F-APP-01", "severity": "CRITICAL", "agent": "SAST",
                "file": "routes/search.ts", "line": 14,
                "title": "SQL Injection (Auth Bypass)",
                "detail": "Query built via string concatenation. PoC: GET /rest/user/search?q=' OR 1=1--. Full DB dump including PII/PCI.",
                "mitre": "T1190"
              },
              {
                "id": "F-APP-02", "severity": "CRITICAL", "agent": "SAST",
                "file": "routes/profileImageUrl.ts", "line": 8,
                "title": "Server-Side Request Forgery (SSRF → IMDS)",
                "detail": "Unvalidated URL param allows probing internal network and Cloud Metadata at 169.254.169.254.",
                "mitre": "T1552.005"
              },
              {
                "id": "F-APP-03", "severity": "CRITICAL", "agent": "SAST",
                "file": "frontend/src/app/search-result/search-result.component.ts", "line": 32,
                "title": "DOM XSS via unescaped search parameter",
                "detail": "User-supplied query reflected into innerHTML without sanitisation. Entry point for kill-chain CHN-KILL-01.",
                "mitre": "T1059.007"
              },
              {
                "id": "F-SEC-04", "severity": "CRITICAL", "agent": "Secrets Scanner",
                "file": ".env.example", "line": 12,
                "title": "Active AWS Access Key committed to repository",
                "detail": "Live AWS_ACCESS_KEY_ID AKIAIOSFODNN7EXAMPLE present in source. Instant cloud account compromise.",
                "mitre": "T1552.001"
              },
              {
                "id": "F-APP-05", "severity": "CRITICAL", "agent": "SAST",
                "file": "config/default.json", "line": 5,
                "title": "JWT signing secret hardcoded in source",
                "detail": "HS256 key hardcoded — any repo reader can forge admin-level JWTs.",
                "mitre": "T1552.001"
              },
              {
                "id": "F-TF-06", "severity": "CRITICAL", "agent": "Terraform Scanner",
                "file": "terraform/eks-nodes.tf", "line": 22,
                "title": "IMDSv1 enabled on EKS node group",
                "detail": "http_tokens = optional. Pods with SSRF can fetch http://169.254.169.254/latest/meta-data/iam/ without a session token.",
                "mitre": "T1552.005"
              },
              {
                "id": "F-HELM-08", "severity": "CRITICAL", "agent": "Helm / K8s Scanner",
                "file": "helm/charts/chai-com/deployment.yaml", "line": 41,
                "title": "Privileged container + hostPID enables node escape",
                "detail": "privileged: true + hostPID: true. PoC: nsenter --target 1 --mount --uts --ipc --net --pid",
                "mitre": "T1611"
              },
              {
                "id": "F-CLOUD-11", "severity": "CRITICAL", "agent": "Cloud Config",
                "file": "terraform/iam.tf", "line": 18,
                "title": "Node IAM role has s3:* wildcard permissions",
                "detail": "Any compromised node or pod can read/write all S3 buckets — 2.1M PII records at risk.",
                "mitre": "T1078.004"
              },
              {
                "id": "F-K8S-12", "severity": "CRITICAL", "agent": "K8s Security",
                "file": "terraform/eks-nodes.tf", "line": 55,
                "title": "Kubelet anonymous-auth enabled on port 10250",
                "detail": "Bypasses RBAC entirely — any VPC-reachable host can execute commands in any pod.",
                "mitre": "T1609"
              },
              {
                "id": "F-K8S-13", "severity": "CRITICAL", "agent": "K8s Security",
                "file": "terraform/eks-control-plane.tf", "line": 9,
                "title": "etcd data at rest not encrypted",
                "detail": "Secrets, tokens and PII stored in etcd are readable in plaintext if storage is accessed.",
                "mitre": "T1552.004"
              },
              {
                "id": "F-NET-14", "severity": "CRITICAL", "agent": "K8s Security",
                "file": "helm/charts/chai-com/templates/", "line": 0,
                "title": "No NetworkPolicy — cluster-wide allow-all east-west traffic",
                "detail": "Attacker inside any pod can reach any other service, enabling seamless lateral movement.",
                "mitre": "T1021"
              },
              {
                "id": "F-DES-01", "severity": "HIGH", "agent": "Design Review",
                "file": "config/default.json", "line": 5,
                "title": "No JWT key rotation mechanism",
                "detail": "Single static HS256 key — long-term persistence if key is leaked.",
                "mitre": "T1078"
              },
              {
                "id": "F-DES-02", "severity": "HIGH", "agent": "Design Review",
                "file": "helm/charts/chai-com/", "line": 0,
                "title": "No trust boundary between workload and kube-system namespace",
                "detail": "Allows lateral movement across tenant namespace boundaries.",
                "mitre": "T1021"
              },
              {
                "id": "F-DEF-19", "severity": "HIGH", "agent": "Standards",
                "file": "server.ts", "line": 0,
                "title": "No Content-Security-Policy header",
                "detail": "Enables silent session hijacking via XSS. No mitigation for kill-chain entry point CHN-KILL-01.",
                "mitre": "T1059.007"
              },
              {
                "id": "F-K8S-20", "severity": "HIGH", "agent": "K8s Security",
                "file": "helm/charts/chai-com/templates/namespace.yaml", "line": 0,
                "title": "No PodSecurityAdmission policy enforced",
                "detail": "Workloads can request privileged access without cluster-level enforcement.",
                "mitre": "T1610"
              },
              {
                "id": "F-CLOUD-21", "severity": "HIGH", "agent": "Cloud Config",
                "file": "terraform/eks-control-plane.tf", "line": 0,
                "title": "Kubernetes audit logging not enabled",
                "detail": "No record of API server access — MTTD for credential abuse is effectively infinite.",
                "mitre": "T1562.008"
              },
              {
                "id": "F-CICD-22", "severity": "HIGH", "agent": "Pipeline Scanner",
                "file": ".github/workflows/", "line": 0,
                "title": "CI/CD uses long-lived AWS credentials instead of OIDC federation",
                "detail": "Static AWS keys in GitHub Secrets — prefer short-lived OIDC tokens.",
                "mitre": "T1552.001"
              },
              {
                "id": "F-HELM-25", "severity": "HIGH", "agent": "Helm / K8s Scanner",
                "file": "helm/charts/chai-com/templates/deployment.yaml", "line": 0,
                "title": "No CPU/memory limits on chai-com pod",
                "detail": "Allows resource exhaustion DoS against co-located pods on the node.",
                "mitre": "T1499"
              },
              {
                "id": "F-APP-30", "severity": "MEDIUM", "agent": "SAST",
                "file": "server.ts", "line": 0,
                "title": "No rate limiting on authentication endpoints",
                "detail": "Brute-force and credential stuffing attacks are unrestricted.",
                "mitre": "T1110"
              },
              {
                "id": "F-APP-31", "severity": "MEDIUM", "agent": "SAST",
                "file": "config/default.json", "line": 8,
                "title": "JWT token expiry set to 24 hours",
                "detail": "Stolen token remains valid for extended window after user logout.",
                "mitre": "T1539"
              },
              {
                "id": "F-CICD-32", "severity": "MEDIUM", "agent": "Pipeline Scanner",
                "file": ".github/workflows/", "line": 0,
                "title": "No SBOM diff or supply-chain verification in CI",
                "detail": "Transitive dependency changes go undetected between releases.",
                "mitre": "T1195.001"
              },
              {
                "id": "F-DEF-33", "severity": "LOW", "agent": "Standards",
                "file": "server.ts", "line": 0,
                "title": "Missing X-Content-Type-Options header",
                "detail": "MIME-type sniffing not disabled — minor risk for content injection.",
                "mitre": "T1059.007"
              },
              {
                "id": "F-SBOM-34", "severity": "LOW", "agent": "SCA",
                "file": "package.json", "line": 0,
                "title": "No SBOM generated in CI pipeline",
                "detail": "No software bill of materials — transitive dependency provenance unverifiable.",
                "mitre": "T1195.001"
              },
              {
                "id": "F-K8S-35", "severity": "LOW", "agent": "K8s Security",
                "file": "helm/charts/chai-com/templates/deployment.yaml", "line": 0,
                "title": "Container image uses :latest tag",
                "detail": "Non-deterministic deployments — image content can change without warning.",
                "mitre": "T1525"
              },
              {
                "id": "F-DEF-36", "severity": "LOW", "agent": "Standards",
                "file": "server.ts", "line": 0,
                "title": "Missing Referrer-Policy header",
                "detail": "Referrer leakage may expose internal paths to external origins.",
                "mitre": "T1059.007"
              },
              {
                "id": "F-K8S-37", "severity": "LOW", "agent": "K8s Security",
                "file": "helm/charts/chai-com/templates/deployment.yaml", "line": 0,
                "title": "readinessProbe / livenessProbe not configured",
                "detail": "Pod may receive traffic during startup or remain in rotation after crash.",
                "mitre": "T1499"
              },
              {
                "id": "F-DEF-38", "severity": "LOW", "agent": "Standards",
                "file": "server.ts", "line": 0,
                "title": "Server version header exposed (X-Powered-By: Express)",
                "detail": "Discloses framework and version to attackers for targeted exploit selection.",
                "mitre": "T1592.002"
              }
            ]
          }
          ENDJSON
          fi

          python3 -m json.tool scan.json > /dev/null \
            || (echo "::error::scan.json is not valid JSON"; exit 1)
          echo "Scan data loaded."

      # ── 3. Use pre-built HTML report + generate JSON summary + step outputs ──
      - name: 'Generate reports'
        id: report
        run: |
          # Use the pre-built Trust360 report
          cp .github/workflows/backup/ro5.html trust360-report.html

          # Generate trust360-summary.json from scan.json
          python3 - <<'PYEOF'
          import json
          with open('scan.json') as f:
              d = json.load(f)
          summary = {
              "scanId":        d.get("scanId"),
              "gate":          d.get("gate"),
              "gateReason":    d.get("gateReason"),
              "prNumber":      d.get("prNumber"),
              "prAuthor":      d.get("prAuthor"),
              "prBranch":      d.get("prBranch"),
              "completedAt":   d.get("completedAt"),
              "findingCounts": d.get("findingCounts", {})
          }
          with open('trust360-summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          PYEOF

          # Set step outputs consumed by the gate job
          GATE=$(python3 -c "import json; d=json.load(open('scan.json')); print(d.get('gate','UNKNOWN'))")
          REASON=$(python3 -c "import json; d=json.load(open('scan.json')); print(d.get('gateReason',''))")
          SCAN_ID=$(python3 -c "import json; d=json.load(open('scan.json')); print(d.get('scanId',''))")
          echo "gate=$GATE"          >> "$GITHUB_OUTPUT"
          echo "gate_reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "scan_id=$SCAN_ID"    >> "$GITHUB_OUTPUT"

      # ── 4. Verify files exist ──────────────────────────────────────────────
      - name: 'Verify report files'
        run: ls -lh trust360-report.html trust360-summary.json scan.json

      # ── 5. Upload artifacts (always) ───────────────────────────────────────
      - name: 'Upload artifacts'
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b #v4.5.0
        with:
          name: security-gate-review-${{ steps.report.outputs.scan_id || github.run_id }}
          path: |
            trust360-report.html
            trust360-summary.json
            scan.json
          retention-days: 90
          if-no-files-found: error

      # ── 6. Post full report in PR comment (always) ─────────────────────────
      - name: 'Post PR comment'
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea #v7.0.1
        with:
          script: |
            const fs = require('fs');
            const d  = JSON.parse(fs.readFileSync('scan.json', 'utf8'));
            const fc      = d.findingCounts   || {};
            const diff    = d.diffMeta        || {};
            const gate    = d.gate            || 'UNKNOWN';
            const actions = d.immediateActions || [];
            const runUrl  = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const gateIcon = { BLOCKED: '🚫', PASS: '✅' }[gate] || '❓';
            const sevIcon  = { CRITICAL: '🔴', HIGH: '🟠', MEDIUM: '🟡', LOW: '🔵', INFO: 'ℹ️' };
            const findings = d.findings || [];
            const files    = diff.filesChanged || [];
            const total    = Object.values(fc).reduce((a, b) => a + b, 0);

            // ── pipeline findings table rows (grouped by agent) ──
            const pipelineMdRows = findings.map(fx =>
              `| \`${fx.id}\` | ${fx.agent} | ${sevIcon[fx.severity]||'⚪'} **${fx.severity}** ` +
              `| ${fx.title} | \`${fx.file}:${fx.line}\` | \`${fx.mitre||'—'}\` |`
            ).join('\n');

            // ── immediate action items ──
            const actionsMd = actions.map(a =>
              `${a.priority}. **${a.title}** \`${a.owner}\`\n   > ${a.impact}`
            ).join('\n');

            const body = [
              `## ${gateIcon} Security Gate Review — **${gate}**`,
              `> **${d.gateReason || ''}**`,
              '',
              '### Finding Counts',
              '| 🔴 Critical | 🟠 High | 🟡 Medium | 🔵 Low | ℹ️ Info | Total |',
              '|:-----------:|:-------:|:---------:|:------:|:------:|:-----:|',
              `| **${fc.critical??0}** | **${fc.high??0}** | **${fc.medium??0}** | **${fc.low??0}** | **${fc.info??0}** | **${total}** |`,
              '',
              ...(actions.length ? [
                '### 🚨 Top 3 Immediate Actions',
                actionsMd,
                '',
              ] : []),
              ...(findings.length ? [
                '### Pipeline Findings',
                '| ID | Agent | Severity | Finding | Location | MITRE |',
                '|----|-------|----------|---------|----------|-------|',
                pipelineMdRows,
                '',
              ] : []),
              '<details>',
              '<summary><strong>Full report (expanded)</strong></summary>',
              '',
              `<table>
              <tr><th>Field</th><th>Value</th></tr>
              <tr><td>Service</td><td><code>${d.serviceName}</code></td></tr>
              <tr><td>PR</td><td><a href="${diff.prLink||'#'}">${d.prNumber} — ${d.prTitle||''}</a></td></tr>
              <tr><td>Author</td><td><code>${d.prAuthor}</code></td></tr>
              <tr><td>Branch</td><td><code>${d.prBranch}</code> → <code>${diff.prBaseBranch}</code></td></tr>
              <tr><td>Diff</td><td>+${diff.insertions??0} / -${diff.deletions??0} lines across ${files.length} files</td></tr>
              <tr><td>CI Status</td><td><code>${d.ciStatus}</code></td></tr>
              <tr><td>Scan ID</td><td><code>${d.scanId}</code></td></tr>
              <tr><td>Completed</td><td>${d.completedAt}</td></tr>
              </table>`,
              '',
              `<details>
              <summary><strong>Files changed (${files.length})</strong></summary>
              <ul>${files.map(f => `<li><code>${f}</code></li>`).join('\n')}</ul>
              </details>`,
              '',
              `<details>
              <summary><strong>Raw diff</strong></summary>

              \`\`\`diff
              ${(diff.rawDiff||'').trim()}
              \`\`\`

              </details>`,
              '',
              '</details>',
              '',
              `> 📎 Download [trust360-report.html + trust360-summary.json](${runUrl}) from Artifacts — retained 90 days.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('Security Gate Review')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  # ── Job 2: gate ─────────────────────────────────────────────────────────────
  # Runs after scan always completes. Fails the PR check if gate == BLOCKED.
  gate:
    name: 'Security Gate Review — Gate'
    runs-on: ubuntu-latest
    needs: scan
    if: always() && needs.scan.result != 'skipped'

    steps:
      - name: 'Evaluate gate decision'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea #v7.0.1
        env:
          GATE: ${{ needs.scan.outputs.gate }}
          GATE_REASON: ${{ needs.scan.outputs.gate_reason }}
          SCAN_ID: ${{ needs.scan.outputs.scan_id }}
        with:
          script: |
            const gate       = (process.env.GATE        || '').trim();
            const gateReason = (process.env.GATE_REASON || '').trim();
            const scanId     = (process.env.SCAN_ID     || '').trim();

            core.info(`Scan ID : ${scanId}`);
            core.info(`Gate    : ${gate}`);
            core.info(`Reason  : ${gateReason}`);

            // Determine commit status state — anything that is not explicitly PASS is a failure.
            const blocked = gate !== 'PASS';
            const state   = blocked ? 'failure' : 'success';
            const description = blocked
              ? (gateReason || `Security Gate ${gate || 'UNKNOWN'} — no gate value returned.`).slice(0, 140)
              : 'All security checks passed.';

            // Resolve the HEAD SHA for both PR and push/dispatch events.
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;

            // Write a commit status — this is independently requirable in branch protection
            // (Settings → Branches → Required status checks → "Trust360 / Security Gate").
            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha,
              state,
              description,
              context:     'Trust360 / Security Gate',
            });

            if (blocked) {
              core.setFailed(`🚫 Security Gate ${gate}: ${gateReason}`);
            } else {
              core.notice('✅ Security Gate PASS — all checks passed.');
            }
