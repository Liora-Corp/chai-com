apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-fixture-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-fixture-app
  template:
    metadata:
      labels:
        app: ci-fixture-app
    spec:
      containers:
        - name: ci-fixture-app
          image: nginx:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
          ports:
            - containerPort: 80
